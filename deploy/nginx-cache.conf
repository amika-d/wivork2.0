# Include inside the server { } block that serves dist/.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Content-hashed build output never changes.
location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; access_log off; }
location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; access_log off; }
location /process/frames/ { add_header Cache-Control "public, max-age=31536000, immutable"; access_log off; }

# Unhashed media: cache for 30 days, revalidate in the background.
location ~* \.(webp|png|jpg|jpeg|svg|mp4|json)$ { add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400"; access_log off; }

# HTML must always revalidate so new deploys show immediately.
location ~* \.html$ { add_header Cache-Control "no-cache"; }
location = / { add_header Cache-Control "no-cache"; }
